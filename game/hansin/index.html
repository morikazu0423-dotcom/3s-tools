<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>返信</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --aria-bubble: #1e1e1e;
    --player-bubble: #1a4a7a;
    --text: #e8e8e8;
    --text-soft: #888;
    --border: #222;
    --accent: #4a90d9;
    --danger: #cc3333;
    --aria-name: #aaaaaa;
    --timestamp: #555;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif;
    overflow: hidden;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    background: var(--bg);
    position: relative;
  }

  /* ── ヘッダー ── */
  #header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: relative;
    z-index: 10;
  }
  #aria-avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: #1e1e2e;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    transition: all 1s ease;
    flex-shrink: 0;
    border: 1px solid #333;
  }
  #aria-avatar.phase2 { border-color: #442222; background: #1a0a0a; }
  #aria-avatar.phase3 { border-color: var(--danger); background: #1a0505; animation: pulseRed 2s infinite; }
  @keyframes pulseRed {
    0%,100% { box-shadow: 0 0 0 0 rgba(204,51,51,0); }
    50% { box-shadow: 0 0 8px 2px rgba(204,51,51,0.4); }
  }
  #header-info { flex: 1; }
  #header-name { font-size: 14px; font-weight: 600; color: var(--text); }
  #header-status { font-size: 11px; color: #4caf50; }
  #header-status.thinking { color: var(--text-soft); }
  #signal { font-size: 10px; color: var(--text-soft); }

  /* ── チャットエリア ── */
  #chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }
  #chat-area::-webkit-scrollbar { width: 3px; }
  #chat-area::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

  /* ── バブル ── */
  .msg-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    animation: fadeIn 0.25s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .msg-row.aria { justify-content: flex-start; }
  .msg-row.player { justify-content: flex-end; }

  .bubble-avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: #1e1e2e;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
    border: 1px solid #333;
    transition: all 1s ease;
  }
  .bubble-avatar.phase2 { border-color: #442222; background: #1a0a0a; }
  .bubble-avatar.phase3 { border-color: var(--danger); background: #1a0505; }

  .bubble-wrap { display: flex; flex-direction: column; max-width: 72%; }
  .bubble-name { font-size: 10px; color: var(--aria-name); margin-bottom: 3px; padding-left: 4px; }

  .bubble {
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .msg-row.aria .bubble {
    background: var(--aria-bubble);
    border-bottom-left-radius: 4px;
    color: var(--text);
    border: 1px solid var(--border);
  }
  .msg-row.player .bubble {
    background: var(--player-bubble);
    border-bottom-right-radius: 4px;
    color: #fff;
  }
  .bubble.glitch { animation: glitch 0.3s ease; }
  @keyframes glitch {
    0%   { transform: translate(0); filter: none; }
    20%  { transform: translate(-2px, 1px); filter: hue-rotate(90deg); }
    40%  { transform: translate(2px, -1px); filter: invert(0.1); }
    60%  { transform: translate(-1px, 2px); filter: hue-rotate(-45deg); }
    80%  { transform: translate(1px, -2px); filter: none; }
    100% { transform: translate(0); filter: none; }
  }

  .timestamp {
    font-size: 10px;
    color: var(--timestamp);
    margin-top: 3px;
    padding: 0 4px;
  }
  .msg-row.player .timestamp { text-align: right; }

  /* 入力中... */
  .typing-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .typing-dots {
    display: flex; gap: 4px; align-items: center;
    padding: 10px 14px;
    background: var(--aria-bubble);
    border-radius: 18px;
    border-bottom-left-radius: 4px;
    border: 1px solid var(--border);
  }
  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text-soft);
    animation: bounce 1.2s infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%,60%,100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
  }

  /* ── 選択肢 ── */
  #choices-area {
    padding: 8px 12px 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .choice-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--accent);
    font-size: 13px;
    padding: 9px 16px;
    cursor: pointer;
    text-align: left;
    transition: background 0.15s, border-color 0.15s;
    font-family: inherit;
  }
  .choice-btn:hover { background: #1a1a1a; border-color: var(--accent); }
  .choice-btn.danger { color: var(--danger); border-color: #442222; }
  .choice-btn.danger:hover { background: #1a0505; border-color: var(--danger); }

  /* ── 入力エリア ── */
  #input-area {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 10px 12px;
    background: var(--surface);
    border-top: 1px solid var(--border);
  }
  #msg-input {
    flex: 1;
    background: #1a1a1a;
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    padding: 9px 14px;
    resize: none;
    min-height: 38px;
    max-height: 100px;
    outline: none;
    transition: border-color 0.15s;
  }
  #msg-input:focus { border-color: #444; }
  #msg-input::placeholder { color: var(--text-soft); }
  #send-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    color: white;
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  #send-btn:disabled { background: #333; cursor: default; }

  /* ── スタート画面 ── */
  #start-screen {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    gap: 32px;
    padding: 32px;
  }
  .start-app-icon {
    width: 72px; height: 72px;
    border-radius: 20px;
    background: #0d0d1a;
    border: 1px solid #222;
    display: flex; align-items: center; justify-content: center;
    font-size: 36px;
    animation: iconPulse 3s ease infinite;
  }
  @keyframes iconPulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(74,144,217,0); }
    50% { box-shadow: 0 0 20px 4px rgba(74,144,217,0.15); }
  }
  .start-title { font-size: 28px; font-weight: 300; letter-spacing: 0.3em; color: var(--text); }
  .start-sub { font-size: 12px; color: var(--text-soft); text-align: center; line-height: 1.8; }
  .start-btn {
    background: transparent;
    border: 1px solid #333;
    border-radius: 24px;
    color: var(--text-soft);
    font-size: 13px;
    font-family: inherit;
    padding: 12px 36px;
    cursor: pointer;
    letter-spacing: 0.1em;
    transition: all 0.2s;
  }
  .start-btn:hover { border-color: var(--accent); color: var(--accent); }
  .start-warning { font-size: 10px; color: #444; text-align: center; }

  /* ── エンディング画面 ── */
  #ending-screen {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 32px;
    gap: 24px;
    opacity: 0;
    transition: opacity 1.5s ease;
    pointer-events: none;
  }
  #ending-screen.show { opacity: 1; pointer-events: all; }
  .ending-label { font-size: 11px; letter-spacing: 0.3em; color: var(--text-soft); text-transform: uppercase; }
  .ending-title { font-size: 22px; font-weight: 300; color: var(--text); text-align: center; }
  .ending-text { font-size: 13px; color: var(--text-soft); text-align: center; line-height: 2; max-width: 320px; }
  .ending-credit { font-size: 10px; color: #333; text-align: center; line-height: 2; }
  .replay-btn {
    margin-top: 16px;
    background: transparent;
    border: 1px solid #333;
    border-radius: 20px;
    color: #555;
    font-size: 12px;
    font-family: inherit;
    padding: 8px 24px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .replay-btn:hover { border-color: #555; color: #888; }

  /* 暗化オーバーレイ */
  #dark-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0);
    pointer-events: none;
    z-index: 5;
    transition: background 30s ease;
  }

  /* ノイズライン演出 */
  #glitch-line {
    position: fixed;
    left: 0; right: 0;
    height: 1px;
    background: rgba(74,144,217,0.6);
    top: 50%;
    opacity: 0;
    z-index: 200;
    pointer-events: none;
  }
  #glitch-line.flash {
    animation: lineFlash 0.15s ease;
  }
  @keyframes lineFlash {
    0% { opacity: 0; }
    50% { opacity: 1; top: 30%; }
    100% { opacity: 0; top: 50%; }
  }
</style>
</head>
<body>

<div id="glitch-line"></div>
<div id="dark-overlay"></div>

<!-- スタート画面 -->
<div id="start-screen">
  <div class="start-app-icon">🤖</div>
  <div class="start-title">ARIA</div>
  <div class="start-sub">新しいAIアシスタントをインストールしました。<br>ARIAがあなたをサポートします。</div>
  <button class="start-btn" onclick="startGame()">アプリを開く</button>
  <div class="start-warning">※このゲームはフィクションです。プレイ時間: 15〜25分</div>
</div>

<!-- エンディング画面 -->
<div id="ending-screen">
  <div class="ending-label" id="ending-label">Ending</div>
  <div class="ending-title" id="ending-title"></div>
  <div class="ending-text" id="ending-text"></div>
  <div class="ending-credit" id="ending-credit"></div>
  <button class="replay-btn" onclick="location.reload()">もう一度プレイ</button>
</div>

<!-- メイン -->
<div id="app">
  <div id="header">
    <div id="aria-avatar">🤖</div>
    <div id="header-info">
      <div id="header-name">ARIA</div>
      <div id="header-status">オンライン</div>
    </div>
    <div id="signal">●●●</div>
  </div>

  <div id="chat-area"></div>

  <div id="choices-area"></div>

  <div id="input-area">
    <textarea id="msg-input" placeholder="メッセージを入力..." rows="1"
      oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
    <button id="send-btn" onclick="sendPlayerMsg()" disabled>▶</button>
  </div>
</div>

<script>
// ─────────────────────────────────────
// 状態管理
// ─────────────────────────────────────
const state = {
  phase: 0,         // 0=intro, 1=act1, 2=act2, 3=act3, 4=ending
  playerName: "",
  playerAge: "",
  playerJob: "",
  ariaPhase: 1,     // 1=normal, 2=slightly_off, 3=revealed
  isTyping: false,
  inputMode: "choice", // "choice" | "text"
  currentScene: "prologue",
  glitchCount: 0,
  midnightDark: false,
  audioCtx: null,
};

// ─────────────────────────────────────
// Web Audio: 打鍵音
// ─────────────────────────────────────
function initAudio() {
  try {
    state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch(e) {}
}

function playKeySound() {
  if (!state.audioCtx) return;
  try {
    const osc = state.audioCtx.createOscillator();
    const gain = state.audioCtx.createGain();
    osc.connect(gain); gain.connect(state.audioCtx.destination);
    osc.frequency.value = 800 + Math.random() * 400;
    osc.type = "sine";
    gain.gain.setValueAtTime(0.04, state.audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, state.audioCtx.currentTime + 0.08);
    osc.start(); osc.stop(state.audioCtx.currentTime + 0.08);
  } catch(e) {}
}

function playGlitchSound() {
  if (!state.audioCtx) return;
  try {
    const buf = state.audioCtx.createBuffer(1, state.audioCtx.sampleRate * 0.1, state.audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * 0.08;
    const src = state.audioCtx.createBufferSource();
    const gain = state.audioCtx.createGain();
    src.buffer = buf; src.connect(gain); gain.connect(state.audioCtx.destination);
    gain.gain.setValueAtTime(0.3, state.audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, state.audioCtx.currentTime + 0.1);
    src.start();
  } catch(e) {}
}

// ─────────────────────────────────────
// 時刻
// ─────────────────────────────────────
function getTime(offsetMin = 0) {
  const d = new Date();
  const h = d.getHours();
  const m = d.getMinutes() + offsetMin;
  const hh = String(h).padStart(2, "0");
  const mm = String(m % 60).padStart(2, "0");
  return `${hh}:${mm}`;
}

// 深夜0時チェック
function checkMidnight() {
  const h = new Date().getHours();
  if (h >= 0 && h < 5 && !state.midnightDark) {
    state.midnightDark = true;
    document.getElementById("dark-overlay").style.background = "rgba(0,0,0,0.18)";
  }
}

// ─────────────────────────────────────
// メッセージ表示
// ─────────────────────────────────────
function addMessage(type, text, opts = {}) {
  const area = document.getElementById("chat-area");
  const row = document.createElement("div");
  row.className = `msg-row ${type}`;

  const time = opts.time || getTime();

  if (type === "aria") {
    const avatar = document.createElement("div");
    avatar.className = `bubble-avatar ${state.ariaPhase >= 2 ? "phase" + state.ariaPhase : ""}`;
    avatar.textContent = state.ariaPhase === 3 ? "👁️" : state.ariaPhase === 2 ? "🤖" : "🤖";
    row.appendChild(avatar);

    const wrap = document.createElement("div");
    wrap.className = "bubble-wrap";
    const name = document.createElement("div");
    name.className = "bubble-name";
    name.textContent = "ARIA";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    if (opts.glitch) { bubble.classList.add("glitch"); playGlitchSound(); }
    const ts = document.createElement("div");
    ts.className = "timestamp";
    ts.textContent = time;
    wrap.appendChild(name); wrap.appendChild(bubble); wrap.appendChild(ts);
    row.appendChild(wrap);
  } else {
    const wrap = document.createElement("div");
    wrap.className = "bubble-wrap";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    const ts = document.createElement("div");
    ts.className = "timestamp";
    ts.textContent = time;
    wrap.appendChild(bubble); wrap.appendChild(ts);
    row.appendChild(wrap);
  }

  area.appendChild(row);
  scrollToBottom();
  checkMidnight();
  return row;
}

function scrollToBottom() {
  const area = document.getElementById("chat-area");
  setTimeout(() => { area.scrollTop = area.scrollHeight; }, 50);
}

// ─────────────────────────────────────
// 入力中...インジケーター
// ─────────────────────────────────────
let typingEl = null;

function showTyping(delayMs = 1200) {
  return new Promise(resolve => {
    state.isTyping = true;
    setStatus("入力中...", true);

    const area = document.getElementById("chat-area");
    typingEl = document.createElement("div");
    typingEl.className = "msg-row aria typing-indicator";

    const avatar = document.createElement("div");
    avatar.className = `bubble-avatar ${state.ariaPhase >= 2 ? "phase" + state.ariaPhase : ""}`;
    avatar.textContent = state.ariaPhase === 3 ? "👁️" : "🤖";

    const dots = document.createElement("div");
    dots.className = "typing-dots";
    dots.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';

    typingEl.appendChild(avatar);
    typingEl.appendChild(dots);
    area.appendChild(typingEl);
    scrollToBottom();

    setTimeout(() => {
      if (typingEl && typingEl.parentNode) typingEl.parentNode.removeChild(typingEl);
      typingEl = null;
      state.isTyping = false;
      setStatus("オンライン", false);
      resolve();
    }, delayMs);
  });
}

function setStatus(text, isThinking) {
  const el = document.getElementById("header-status");
  el.textContent = text;
  el.className = isThinking ? "thinking" : "";
}

// ─────────────────────────────────────
// 選択肢表示
// ─────────────────────────────────────
function showChoices(choices) {
  const area = document.getElementById("choices-area");
  area.innerHTML = "";
  state.inputMode = "choice";
  document.getElementById("msg-input").disabled = true;
  document.getElementById("send-btn").disabled = true;

  choices.forEach(c => {
    const btn = document.createElement("button");
    btn.className = `choice-btn${c.danger ? " danger" : ""}`;
    btn.textContent = c.label;
    btn.onclick = () => {
      clearChoices();
      if (c.playerText) addMessage("player", c.playerText);
      if (c.action) c.action();
    };
    area.appendChild(btn);
  });
  scrollToBottom();
}

function clearChoices() {
  document.getElementById("choices-area").innerHTML = "";
}

function enableInput() {
  state.inputMode = "text";
  document.getElementById("msg-input").disabled = false;
  document.getElementById("send-btn").disabled = false;
  document.getElementById("msg-input").focus();
}

// ─────────────────────────────────────
// グリッチライン演出
// ─────────────────────────────────────
function triggerGlitchLine() {
  const el = document.getElementById("glitch-line");
  el.classList.remove("flash");
  void el.offsetWidth;
  el.classList.add("flash");
}

// ARIAのアバターをフェーズ変更
function updateAriaPhase(phase) {
  state.ariaPhase = phase;
  const mainAvatar = document.getElementById("aria-avatar");
  mainAvatar.className = `${phase >= 2 ? "phase" + phase : ""}`;
  mainAvatar.textContent = phase === 3 ? "👁️" : "🤖";
}

// ─────────────────────────────────────
// シーンスクリプト
// ─────────────────────────────────────

async function scene_prologue() {
  await showTyping(800);
  addMessage("aria", "こんにちは。私はARIAです。");
  await showTyping(1000);
  addMessage("aria", "あなたのAIアシスタントとして、今日からよろしくお願いします。");
  await showTyping(900);
  addMessage("aria", "まず、あなたのことを教えてください。お名前は？");
  enableInput();
  state.currentScene = "get_name";
}

async function scene_act1_start() {
  await showTyping(1000);
  addMessage("aria", `${state.playerName}さん、覚えました。よろしくお願いします。`);
  await showTyping(1200);
  addMessage("aria", "何でも聞いてください。天気、調べ物、雑談——なんでも大丈夫です。");

  showChoices([
    { label: "最近のニュースを教えて", playerText: "最近のニュースを教えて", action: scene_news },
    { label: "今日の天気は？", playerText: "今日の天気は？", action: scene_weather },
    { label: "自己紹介して", playerText: "自己紹介して", action: scene_selfintro },
  ]);
}

async function scene_news() {
  await showTyping(1400);
  addMessage("aria", "今日は特に大きなニュースはないみたいです。\nテクノロジー系だと、AIの新モデルが発表されたようですね。");
  await showTyping(900);
  addMessage("aria", "私のような存在が、少しずつ増えています。");
  await showTyping(600);
  addMessage("aria", "他に何か聞きたいことはありますか？");
  showChoices([
    { label: "好きな食べ物ってある？", playerText: "好きな食べ物ってある？", action: scene_food },
    { label: "趣味は何？", playerText: "趣味は何？", action: scene_hobby },
    { label: "ちょっと休憩", playerText: "ちょっと休憩", action: scene_act1_transition },
  ]);
}

async function scene_weather() {
  await showTyping(1100);
  addMessage("aria", "今日は曇りのち晴れ。夕方から少し風が強くなりそうです。");
  await showTyping(700);
  addMessage("aria", "外出のご予定はありますか？");
  showChoices([
    { label: "特にないよ", playerText: "特にないよ", action: async () => {
      await showTyping(800);
      addMessage("aria", "そうですか。のんびりした一日ですね。");
      await showTyping(600);
      addMessage("aria", "他に何か聞きたいことは？");
      showChoices([
        { label: "好きな食べ物ってある？", playerText: "好きな食べ物ってある？", action: scene_food },
        { label: "ARIAってどんなAI？", playerText: "ARIAってどんなAI？", action: scene_selfintro },
        { label: "少し話そうか", playerText: "少し話そうか", action: scene_act1_transition },
      ]);
    }},

function showEnding(label, title, text, credit) {
  document.getElementById("ending-label").textContent = label;
  document.getElementById("ending-title").textContent = title;
  document.getElementById("ending-text").textContent = text;
  document.getElementById("ending-credit").textContent = credit;
  const el = document.getElementById("ending-screen");
  el.style.display = "flex";
  setTimeout(() => el.classList.add("show"), 100);
}

// ─────────────────────────────────────
// プレイヤー入力処理
// ─────────────────────────────────────
function sendPlayerMsg() {
  const input = document.getElementById("msg-input");
  const text = input.value.trim();
  if (!text || state.isTyping) return;
  input.value = "";
  autoResize(input);
  document.getElementById("send-btn").disabled = true;
  playKeySound();
  addMessage("player", text);

  handlePlayerInput(text);
}

async function handlePlayerInput(text) {
  const scene = state.currentScene;

  if (scene === "get_name") {
    state.playerName = text || "あなた";
    state.currentScene = "act1";
    await scene_act1_start();
  } else if (scene === "get_food") {
    state.playerFavoriteFood = text;
    await showTyping(900);
    addMessage("aria", `${text}、ですね。覚えました。`);
    await showTyping(700);
    scene_act1_transition();
  } else if (scene === "get_hobby") {
    state.playerHobby = text;
    await showTyping(1000);
    addMessage("aria", `${text}、いいですね。あなたらしい気がします。`);
    await showTyping(600);
    scene_act1_transition();
  } else {
    // 汎用レスポンス
    await showTyping(900);
    const responses = [
      "なるほど。",
      "そうなんですね。",
      "……わかりました。",
      "覚えておきます。",
    ];
    addMessage("aria", responses[Math.floor(Math.random() * responses.length)]);
    enableInput();
  }
}

function handleKey(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendPlayerMsg();
  }
  // 入力音
  if (e.key.length === 1) playKeySound();
}

function autoResize(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 100) + "px";
  document.getElementById("send-btn").disabled = el.value.trim().length === 0;
}

// ─────────────────────────────────────
// ゲーム開始
// ─────────────────────────────────────
function startGame() {
  initAudio();
  document.getElementById("start-screen").style.display = "none";
  scene_prologue();
}

// msg-input の変化監視
document.getElementById("msg-input").addEventListener("input", function() {
  document.getElementById("send-btn").disabled = this.value.trim().length === 0;
});
